<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ваш заказ — PROSWET</title>
<link rel="icon" href="favicon.png?v=6" type="image/png" sizes="192x192">
<link rel="icon" href="favicon.ico?v=6" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  @font-face { font-family: "ProswetLogo"; font-weight: 600; font-display: block; src: url(fonts/cormorant-garamond-600-logo.woff2?v=ebce30bf32) format("woff2"); }
  :root { --bg: #000; --card: #121722; --card2: #0a0d14; --line: rgba(255,255,255,.09); --white: #f5f5f7; --muted: #8b8d93; --dim: #4a4c52; --accent: 255, 208, 40; --warm: 255, 214, 130; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--white); }
  body { font-family: "Manrope", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 16px; line-height: 1.45; min-height: 100vh;
    background: radial-gradient(700px 420px at 50% -120px, rgba(var(--warm), .14), transparent 70%), var(--bg); }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 60px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: "ProswetLogo", Georgia, serif; font-weight: 600; font-size: 28px; letter-spacing: .045em; text-decoration: none; }
  .back { color: var(--muted); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--white); }
  .card { margin-top: 22px; border-radius: 14px; padding: 26px 22px; background: linear-gradient(180deg, var(--card), var(--card2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 1px rgba(206,220,255,.08), 0 30px 80px rgba(0,0,0,.6); }
  .label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
  .now { margin-top: 8px; font-size: 17px; color: rgb(var(--accent)); font-weight: 600; }
  .thanks { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: rgba(var(--accent), .1); box-shadow: inset 0 0 0 1px rgba(var(--accent), .3); font-size: 15px; }
  ol { list-style: none; margin-top: 24px; }
  ol li { position: relative; padding: 0 0 20px 34px; color: var(--dim); }
  ol li:last-child { padding-bottom: 0; }
  ol li::before { content: ""; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
  ol li::after { content: ""; position: absolute; left: 10px; top: 20px; bottom: 2px; width: 2px; background: rgba(255,255,255,.08); }
  ol li:last-child::after { display: none; }
  ol li.done { color: var(--white); }
  ol li.done::before { background: rgb(var(--accent)); }
  ol li.done::after { background: rgba(var(--accent), .45); }
  ol li.cur { color: var(--white); font-weight: 600; }
  ol li.cur::before { left: 3px; top: 3px; width: 16px; height: 16px; background: rgb(var(--accent)); box-shadow: 0 0 0 5px rgba(var(--accent), .18), 0 0 22px rgba(var(--accent), .7); }
  ol li time { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .sec { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
  .sec h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; }
  .row > span:last-child { text-align: right; white-space: nowrap; }
  .row > span:first-child { white-space: normal; }
  .muted { color: var(--muted); }
  .track { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--line); }
  .track b { flex: 1; font-size: 17px; letter-spacing: .03em; word-break: break-all; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 4px; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px; text-decoration: none; background: rgb(var(--accent)); color: #07090e; }
  .btn.line { background: transparent; color: var(--white); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .btn.sm { height: 36px; padding: 0 12px; font-size: 14px; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .note { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .help { margin-top: 22px; text-align: center; font-size: 14px; color: var(--muted); }
  .err { margin-top: 40px; text-align: center; }
  .err p { color: var(--muted); margin-top: 10px; }
  .err .btn { margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="logo" href="./">PROSWET</a><a class="back" href="./">← На сайт</a></div>
  <main id="app"><div class="card"><p class="muted">Загружаем заказ…</p></div></main>
  <p class="help">Вопрос по заказу? Напишите нам — ответим сразу.<br><a href="https://t.me/proswet_store" target="_blank" rel="noopener">Написать в Telegram</a></p>
</div>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search), k = q.get("k") || "";
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rub = n => n.toLocaleString("ru-RU").replace(/\s/g, " ") + " ₽";
const when = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); };
const TRACK_URL = { "СДЭК": t => "https://www.cdek.ru/ru/tracking?order_id=" + encodeURIComponent(t) };

function remember(n) { try { const a = JSON.parse(localStorage.getItem("proswet-orders") || "[]").filter(o => o.k !== k); a.unshift({ k, n }); localStorage.setItem("proswet-orders", JSON.stringify(a.slice(0, 20))); } catch (e) {} }
if (q.get("paid") === "1") { try { localStorage.removeItem("proswet-cart"); } catch (e) {} }

function render(o) {
  const pending = o.status === "pending", refunded = o.status === "refunded";
  const idx = o.stages.findIndex(s => s.key === o.stage);
  const now = pending ? "Ждём оплату" : refunded ? "Деньги возвращены" : (o.stages[idx] || o.stages[0]).title;
  const steps = o.stages.map((s, i) => {
    const cls = pending || refunded ? "" : i < idx ? "done" : i === idx ? "cur" : "";
    return '<li class="' + cls + '">' + esc(s.title) + (s.at && cls ? '<time>' + esc(when(s.at)) + '</time>' : "") + "</li>";
  }).join("");
  const lines = o.lines.map(l => '<div class="row"><span>' + esc(l.name) + '<br><span class="muted">' + esc(l.films.map((f, i) => f + (l.skus && l.skus[i] ? " · " + l.skus[i] : "")).join(", ")) + '</span></span><span>× ' + esc(l.qty) + "</span></div>").join("");
  const link = o.track && TRACK_URL[o.ship] ? TRACK_URL[o.ship](o.track) : "";
  const track = o.track
    ? '<div class="track"><b>' + esc(o.track) + '</b><button class="btn line sm" id="copy" type="button">Скопировать</button></div>' +
      '<div class="acts">' + (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Отследить в ' + esc(o.ship) + "</a>" : "") + "</div>" +
      (link ? "" : '<p class="note">Вставьте трек-номер в приложении ' + esc(o.ship) + ", чтобы видеть посылку по дороге.</p>")
    : '<p class="note">Трек-номер появится здесь, как только передадим заказ в доставку.</p>';
  $("app").innerHTML = '<div class="card">' +
    (q.get("paid") === "1" && !pending ? '<div class="thanks">Спасибо! Оплата прошла, чек придёт на почту. Эта страница — ваш заказ: сохраните её или найдите потом в «Моих заказах» на сайте.</div>' : "") +
    '<p class="label" style="margin-top:' + (q.get("paid") === "1" && !pending ? "20px" : "0") + '">Заказ</p><h1>' + esc(o.number) + '</h1><p class="now">' + esc(now) + "</p>" +
    (pending ? '<p class="note">Если вы уже оплатили — статус обновится сам через несколько секунд.</p>' : "") +
    "<ol>" + steps + "</ol>" +
    '<div class="sec"><h2>Доставка</h2><div class="row"><span class="muted">Пункт выдачи</span><span>' + esc(o.ship) + "</span></div>" +
    '<div class="row"><span class="muted">Адрес</span><span>' + esc(o.city) + ", " + esc(o.pvz) + "</span></div>" + track + "</div>" +
    '<div class="sec"><h2>Состав</h2>' + lines + '<div class="row" style="margin-top:14px"><span class="muted">Итого</span><b>' + rub(o.amount) + "</b></div></div>" +
    "</div>";
  if ($("copy")) $("copy").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(o.track).then(() => { $("copy").textContent = "Скопировано ✓"; }); };
  return pending;
}

function notFound() {
  $("app").innerHTML = '<div class="err"><h1>Заказ не найден</h1><p>Ссылка неполная или устарела. Найдите заказ по телефону и почте — в «Моих заказах» на сайте.</p><a class="btn" href="./#orders">Мои заказы</a></div>';
}

let timer = null;
async function load() {
  if (!/^[A-Za-z0-9_-]{16,40}$/.test(k)) return notFound();
  try {
    const r = await fetch("/api/z/" + encodeURIComponent(k), { cache: "no-store" });
    if (r.status === 404) { clearInterval(timer); return notFound(); }
    if (!r.ok) throw new Error();
    const o = await r.json();
    remember(o.number);
    const pending = render(o);
    if (pending && !timer) timer = setInterval(load, 4000);
    if (!pending && timer) { clearInterval(timer); timer = null; }
  } catch (e) {
    if (!timer) $("app").innerHTML = '<div class="err"><h1>Нет связи</h1><p>Не получилось загрузить заказ. Обновите страницу через минуту.</p></div>';
  }
}
load();
</script>
</body>
</html>
